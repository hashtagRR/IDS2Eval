# UNSW-NB15, official train/test partition. This mirror follows the documented
# convention (training-set = 175,341 rows, testing-set = 82,332) - verified.
dataset:
  name: unsw-nb15
  train_file: UNSW_NB15_training-set.csv.gz
  test_file: UNSW_NB15_testing-set.csv.gz
schema:
  label_column: label
  attack_category_column: attack_cat
  drop_columns: [id]
audit:
  resplit_falsification: false   # no session/IP columns in this feature set
  known_issue_lookup: true
output:
  save_preprocessed: false
  write_scorecard_plot: true
