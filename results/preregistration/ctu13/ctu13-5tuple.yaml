# CTU-13, bidirectional NetFlow release (Garcia et al., 2014), prepared by
# validation/ctu13_prepare.py: background flows excluded, label botnet/normal,
# botnet family and scenario number added. Grouping key: five-tuple.
dataset:
  name: ctu-13
  raw_files:
    - data/ctu13/ctu13_labelled.csv.gz
  split_ratio: 0.8
  group_columns: [SrcAddr, Sport, DstAddr, Dport, Proto]
schema:
  label_column: label
  attack_category_column: family
  drop_columns: [StartTime, scenario, original_label]
  timestamp_column: StartTime
  scenario_column: scenario
  id_like_columns: [SrcAddr, DstAddr, Sport, Dport]
audit:
  resplit_falsification: true
  repeated_seed_falsification_check: true
  repeated_seed_count: 10
  result_robustness_check: true
  reuse_removal_falsification: true
  scenario_holdout_falsification: true
  cross_capture_matrix_check: true
  known_issue_lookup: true
  homogeneity_cluster_columns: [SrcAddr]
output:
  dir: out
  save_preprocessed: false
  write_scorecard_plot: false
