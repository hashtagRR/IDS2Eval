# CICDDoS2019 full-scale, falsification-only variant: both merged day-files combined
# as dataset.raw_files, so resplit_falsification/repeated_seed_falsification_check can
# build their own random-vs-grouped comparison split from the raw data (needed since
# these checks are incompatible with a fixed train_file/test_file pair - see
# cic-ddos2019-fullscale.yaml, the primary result using the official day-based split).
# Same pattern as cic-ids2017.yaml / cic-ids2017-glf.yaml.
dataset:
  name: cic-ddos2019-fullscale-resplit
  raw_files:
    - /tmp/ids2eval_task/data/train-full.csv.gz
    - /tmp/ids2eval_task/data/test-full.csv.gz
  split_ratio: 0.8
  chunk_size: 200000
  group_columns: [Source IP, Source Port, Destination IP, Destination Port, Protocol]
schema:
  label_column: Label
  drop_columns: ["Unnamed: 0", Flow ID, Timestamp, SimillarHTTP]
  id_like_columns: [Source IP, Destination IP, Source Port, Destination Port]
audit:
  dedup_check: false
  label_conflict_check: false
  near_duplicate_class_check: false
  leakage_screen: false
  one_rule_check: false
  feature_auc_ranking_check: false
  identity_column_flag: false
  port_protocol_shortcut_check: false
  temporal_leakage_check: false
  temporal_realism_check: false
  flow_group_leakage_check: false
  row_order_leakage_check: false
  homogeneity_test: false
  class_distribution_report: false
  low_cardinality_warning: false
  schema_fingerprint_check: false
  data_integrity_check: false
  resplit_falsification: true
  result_robustness_check: true
  repeated_seed_falsification_check: true
  repeated_seed_count: 5
  known_issue_lookup: false
  checkpoint: true
output:
  dir: /tmp/ids2eval_task/out
  save_preprocessed: false
  write_scorecard_plot: false
