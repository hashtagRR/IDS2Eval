# Corrected CIC-IDS2017 (Liu et al. 2022 re-extraction, DistriNet CICIDS2017_improved),
# audited with IDS2Eval for paper Section 5, with the release maintainers' recommended
# labelling: every "Attempted" flow (Attempted Category != -1) relabelled as BENIGN by
# validation/cic17_attempted_benign.py, since the maintainers state that Attempted flows
# must not be a separate label. "Attempted Category" is dropped with the other
# non-feature columns; the two initial-window columns are dropped by default (Section 5.4
# reruns the audit with them kept).
dataset:
  name: cic-ids2017-improved
  raw_files:
    - data/cic17-benign/monday.csv.gz
    - data/cic17-benign/tuesday.csv.gz
    - data/cic17-benign/wednesday.csv.gz
    - data/cic17-benign/thursday.csv.gz
    - data/cic17-benign/friday.csv.gz
  split_ratio: 0.8
  chunk_size: 200000
  group_columns: [Src IP, Src Port, Dst IP, Dst Port, Protocol]
schema:
  label_column: Label
  drop_columns:
    - id
    - Flow ID
    - Timestamp
    - Attempted Category
    - FWD Init Win Bytes
    - Bwd Init Win Bytes
  id_like_columns: [Src IP, Dst IP, Src Port, Dst Port]
audit:
  resplit_falsification: true
  result_robustness_check: true
  repeated_seed_falsification_check: true
  known_issue_lookup: true
  checkpoint: true
output:
  dir: out
  save_preprocessed: false
  write_scorecard_plot: false
