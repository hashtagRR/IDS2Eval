[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ids2eval"
version = "0.2.3"
description = "Config-driven data-quality-audit and benchmarking toolkit for NIDS datasets"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
keywords = ["intrusion detection", "NIDS", "dataset audit", "data quality", "benchmarking", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "pyyaml",
    "pandas",
    "numpy",
    "scikit-learn>=1.4",  # tree models accept NaN (unseen categories, see features.encode_multi)
    "scipy",
    "imbalanced-learn",
    "xgboost",
    "pyarrow",
]

[project.urls]
Homepage = "https://hashtagRR.github.io/IDS2Eval"
Source = "https://github.com/hashtagRR/IDS2Eval"
Issues = "https://github.com/hashtagRR/IDS2Eval/issues"
Documentation = "https://github.com/hashtagRR/IDS2Eval/blob/main/guide/usage.md"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
plots = ["matplotlib"]

[project.scripts]
ids2eval = "ids2eval.cli:main"
ids2eval-dashboard = "ids2eval.dashboard.server:main"
ids2eval-ui = "ids2eval.dashboard.server:main"   # older name, kept as an alias

[tool.setuptools.packages.find]
include = ["ids2eval*"]

[tool.setuptools.package-data]
"ids2eval.dashboard" = ["static/*"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "S"]
# BLE001 (blind except) and TRY004 (prefer TypeError) aren't selected:
# this codebase deliberately catches bare Exception in a few best-effort,
# never-crash-the-whole-run spots (benchmark.py's per-classifier loop,
# _feature_importance's introspection), and deliberately uses ValueError
# for every user-facing validation error rather than TypeError, including
# ones that happen to be about a value's type - consistent with
# config.py's own validate_config() pattern.
#
# S = flake8-bandit (security lint). S101 (use of assert) is ignored in
# tests/ below since pytest's own assertion mechanism IS bare assert -
# that's not a security concern, it's how the test suite works. S310
# (urlopen scheme audit) is ignored there too: test_dashboard.py only ever
# opens http:// URLs to its own local test server.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S310"]
