# IDS2Eval config schema (v1)
# Every field explained, with defaults and examples: configs/README.md
# Copy this file, fill in `dataset` and `schema` for your data, and pass it with --config.

random_seed: 0

dataset:
  name: null                   # required
  raw_files: []                # required, unless train_file + test_file are set
  train_file: null             # required, unless raw_files is set (use with test_file)
  test_file: null              # required, unless raw_files is set (use with train_file)
  split_ratio: 0.8
  split_mode: random
  group_columns: []            # required if split_mode: grouped
  chunk_size: null
  max_rows: null

schema:
  label_column: null           # required
  attack_category_column: null
  drop_columns: []
  id_like_columns: []
  timestamp_column: null
  flow_id_columns: []
  scenario_column: null
  feature_categories: {}

label_grouping:
  attack_type_mapping: {}

preprocessing:
  dedup: true
  scaling: standard
  sampling:
    binary: none
    type: none

audit:
  # v1, on by default
  dedup_check: true
  label_conflict_check: true
  near_duplicate_class_check: true
  leakage_screen: true
  one_rule_check: true
  feature_auc_ranking_check: true
  identity_column_flag: true
  port_protocol_shortcut_check: true
  temporal_leakage_check: true
  temporal_realism_check: true
  flow_group_leakage_check: true
  row_order_leakage_check: true
  homogeneity_test: true
  resplit_falsification: true   # optional, needs dataset.group_columns set
  scenario_holdout_falsification: true
  class_distribution_report: true
  low_cardinality_warning: true
  schema_fingerprint_check: true
  data_integrity_check: true

  # v2, opt-in
  synthetic_realism_check: false
  cross_dataset_drift_check: false
  cross_capture_matrix_check: false
  feature_category_ablation_check: false
  artifact_sensitivity_check: false
  result_robustness_check: false
  known_issue_lookup: false
  seed_sensitivity_check: false
  reference_dataset: null      # required if synthetic_realism_check or cross_dataset_drift_check is true

classifiers:
  list: all
  tuning: false
  calibration: none
  hyperparameters: {}
  search_space: {}

output:
  dir: ./output
  format: parquet
  save_preprocessed: true
  keep_runs: 10
  write_scorecard_plot: false

# Not supported: feature engineering (imputation, feature selection, dimensionality
# reduction), hyperparameter search deeper than classifiers.tuning, and multi-stage
# cascades. See configs/README.md and the "scope" section on the docs site for why.
