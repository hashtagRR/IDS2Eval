# BoT-IoT, the OFFICIAL UNSW/Koroniotis-et-al. "5% reduced, all-features" artifact
# (research.unsw.edu.au/projects/bot-iot-dataset), sourced directly from OpenML dataset
# 42072 "bot-iot-all-features", created by the original dataset authors (Koroniotis,
# Moustafa, Sitnikova, Turnbull). Not the University of Queensland NetFlow-V2
# conversion used in bot-iot.yaml. This is the artifact most published BoT-IoT papers
# actually train and report on, real saddr/daddr/sport/dport columns included (the
# NetFlow-V2 file drops IPs entirely). 3,668,522 rows - the field's own "5% reduced"
# convention, not a sample we chose.
#
# No official train/test split ships with this variant (unlike ToN-IoT's
# Train_Test_Network.csv), so this builds its own 80/20 split like CIC-IDS2017 does.
#
# `attack` is a redundant binary 0/1 target for the same rows `category` already
# labels (5-class: DoS/DDoS/Reconnaissance/Normal/Theft) - dropped so it can't leak
# the answer. `subcategory` is a finer-grained version of the SAME label `category`
# already gives (e.g. category=DoS, subcategory=UDP) - dropped for the same reason.
# `pkSeqID` is a bare sequential row identifier, not a feature.
#
# Real, verified characteristic worth knowing before reading any result: only 477 of
# 3,668,522 rows (0.013%) are Normal traffic - even more skewed than the NetFlow-V2
# release's own 0.43% benign share.
dataset:
  name: bot-iot-official
  raw_files:
    - bot-iot-all-features.parquet
  split_ratio: 0.8
  group_columns: [saddr, sport, daddr, dport, proto]
schema:
  label_column: category
  drop_columns: [pkSeqID, attack, subcategory]
  id_like_columns: [saddr, daddr, sport, dport]
  timestamp_column: stime
audit:
  resplit_falsification: true
  result_robustness_check: true
  repeated_seed_falsification_check: true
  known_issue_lookup: true
output:
  save_preprocessed: false
  write_scorecard_plot: true
